<title>Admin hub</title>
<!-- desc: Admin-only tools for The Underground: Reborn. Log in with an admin account. -->
<header class="pagehead">
  <span class="label">Admins only</span>
  <h1>Admin hub</h1>
</header>

<section class="prose" data-admin>
  <div data-state="loading" class="note">Checking your login&hellip;</div>

  <div data-state="loggedout" hidden class="note">
    <p>This page is for admins. Log in with Discord.</p>
    <p><a class="btn primary login-btn" data-login href="#">Log in with Discord</a></p>
  </div>

  <div data-state="denied" hidden class="note">
    <p>Your account doesn't have admin access. If it should, ask the owner to check your Discord role.</p>
  </div>

  <div data-state="hub" hidden>
    <p class="lede">Signed in as <strong data-name></strong>. Admin sessions last 8 hours.</p>
    <div data-links class="hublinks"></div>
  </div>
</section>

<script src="/assets/forms.js" defer></script>
